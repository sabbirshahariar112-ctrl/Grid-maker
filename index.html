<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Maker Pro - Advanced Grid Configuration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Grid Maker Pro</h1>
            <p>Create custom grids with individual row & column spacing</p>
        </header>

        <div class="main-content">
            <!-- Control Panel -->
            <div class="control-panel">
                <div class="section">
                    <h2>📐 Grid Settings</h2>
                    
                    <div class="form-group">
                        <label for="rows">Number of Rows:</label>
                        <input type="number" id="rows" min="1" max="100" value="8">
                        <span class="info">1 - 100</span>
                    </div>

                    <div class="form-group">
                        <label for="columns">Number of Columns:</label>
                        <input type="number" id="columns" min="1" max="100" value="10">
                        <span class="info">1 - 100</span>
                    </div>

                    <div class="form-group">
                        <label for="defaultRowSpacing">Default Row Spacing (cm):</label>
                        <input type="number" id="defaultRowSpacing" min="0.1" max="50" step="0.1" value="2">
                        <span class="info">0.1cm - 50cm</span>
                    </div>

                    <div class="form-group">
                        <label for="defaultColumnSpacing">Default Column Spacing (cm):</label>
                        <input type="number" id="defaultColumnSpacing" min="0.1" max="50" step="0.1" value="2">
                        <span class="info">0.1cm - 50cm</span>
                    </div>

                    <button id="generateBtn" class="btn btn-primary">Generate Grid</button>
                </div>

                <!-- Row Spacing Control -->
                <div class="section">
                    <h2>📏 Custom Row Spacing (cm)</h2>
                    <div id="rowSpacingContainer" class="spacing-container"></div>
                </div>

                <!-- Column Spacing Control -->
                <div class="section">
                    <h2>📐 Custom Column Spacing (cm)</h2>
                    <div id="columnSpacingContainer" class="spacing-container"></div>
                </div>

                <!-- Action Buttons -->
                <div class="section">
                    <button id="resetBtn" class="btn btn-secondary">Reset to Default</button>
                    <button id="exportBtn" class="btn btn-secondary">Export Config</button>
                    <button id="downloadBtn" class="btn btn-secondary">Download Grid as Image</button>
                </div>
            </div>

            <!-- Grid Preview -->
            <div class="grid-preview-section">
                <h2>Grid Preview</h2>
                <div id="gridPreview" class="grid-preview"></div>
                <div id="gridInfo" class="grid-info"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
