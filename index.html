<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Maker Pro - Advanced Grid Creator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h1>🎯 Grid Maker Pro</h1>
                <p>Advanced Grid Creator</p>
            </div>

            <div class="panel">
                <h3>📊 Grid Configuration</h3>
                <div class="form-group">
                    <label>Rows</label>
                    <input type="number" id="rows" min="1" max="100" value="8">
                </div>
                <div class="form-group">
                    <label>Columns</label>
                    <input type="number" id="columns" min="1" max="100" value="10">
                </div>
                <div class="form-group">
                    <label>Row Height (cm)</label>
                    <input type="number" id="defaultRowSpacing" min="0.1" max="50" step="0.1" value="2">
                </div>
                <div class="form-group">
                    <label>Column Width (cm)</label>
                    <input type="number" id="defaultColumnSpacing" min="0.1" max="50" step="0.1" value="2">
                </div>
            </div>

            <div class="panel">
                <h3>🎨 Grid Styling</h3>
                <div class="form-group">
                    <label>Line Color</label>
                    <input type="color" id="lineColor" value="#000000">
                </div>
                <div class="form-group">
                    <label>Line Width (px)</label>
                    <input type="number" id="lineWidth" min="0.5" max="5" step="0.5" value="1">
                </div>
                <div class="form-group">
                    <label>Background Color</label>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="showLabels" checked>
                        Show Labels (A1, B2, etc.)
                    </label>
                </div>
            </div>

            <div class="panel">
                <h3>📐 Paper Size</h3>
                <select id="paperSize">
                    <option value="custom">Custom</option>
                    <option value="a4">A4</option>
                    <option value="a3">A3</option>
                    <option value="letter">Letter</option>
                    <option value="legal">Legal</option>
                </select>
            </div>

            <div class="panel">
                <h3>🖼️ Image Upload (Optional)</h3>
                <div class="upload-area" id="uploadArea">
                    <p>📁 Drag & Drop or Click</p>
                </div>
                <input type="file" id="imageInput" style="display:none;" accept="image/*">
            </div>

            <div class="panel">
                <h3>⚙️ Cell Values</h3>
                <div id="cellValuesContainer" style="max-height: 200px; overflow-y: auto;"></div>
            </div>

            <div class="action-buttons">
                <button id="generateBtn" class="btn btn-primary">🔄 Generate Grid</button>
                <button id="printBtn" class="btn btn-secondary">🖨️ Print</button>
                <button id="pdfBtn" class="btn btn-secondary">📥 Download PDF</button>
                <button id="resetBtn" class="btn btn-danger">🔄 Reset</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="preview-container">
                <div class="preview-header">
                    <h2>Grid Preview</h2>
                    <span id="gridDimensions" class="dimensions">8 × 10</span>
                </div>
                <div class="preview-area">
                    <div id="gridContainer" class="grid-container">
                        <!-- Grid will be generated here -->
                    </div>
                </div>
                <div class="grid-info">
                    <p id="gridStats">Click Generate Grid to preview</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
